# Render blueprint for the public "try it" demo (free plan). See deploy/DEMO.md.
services:
  - type: web
    name: wildcatsnacks-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /theme.css
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Demo
      # wildcatsnacks-demo = a snapshot of the live configuration shown to visitors.
      # Switch back to wildcatsnacks (official 2026 menu) or generic when the demo is over.
      - key: Seed__Profile
        value: wildcatsnacks-demo
      - key: TZ
        value: America/New_York
